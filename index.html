<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Registro</title>

    <link rel="stylesheet" href="style.css">

    <!-- Lector QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>

    <main class="contenedor">

        <h1>Sistema de Registro</h1>

        <p class="subtitulo" id="subtitulo">
            Selecciona una opción
        </p>


        <!-- ============================= -->
        <!-- MENU PRINCIPAL -->
        <!-- ============================= -->

        <div id="menuPrincipal" class="pantalla">

            <div class="botones-principales">

                <button id="btnEntrada" class="boton entrada">
                    ENTRADA
                </button>

                <button id="btnSalida" class="boton salida">
                    SALIDA
                </button>

            </div>

        </div>


        <!-- ============================= -->
        <!-- OPCIONES DE FOLIO -->
        <!-- ============================= -->

        <div id="opcionesFolio" class="pantalla oculto">

            <h2 id="tituloFolio">
                Folio
            </h2>

            <p class="subtitulo">
                ¿Cómo deseas ingresar el folio?
            </p>

            <button id="btnManual" class="boton boton-secundario">
                ✏️ INTRODUCIR FOLIO
            </button>

            <button id="btnQR" class="boton boton-qr">
                📷 ESCANEAR QR
            </button>

            <button id="btnCancelarFolio" class="boton cancelar">
                CANCELAR
            </button>

        </div>


        <!-- ============================= -->
        <!-- FOLIO MANUAL -->
        <!-- ============================= -->

        <div id="pantallaManual" class="pantalla oculto">

            <h2>Introduce el folio</h2>

            <input
                type="text"
                id="folio"
                placeholder="Ingresa tu folio"
                autocomplete="off"
            >

            <button id="btnContinuarFolio" class="boton registrar">
                CONTINUAR
            </button>

            <button id="btnCancelarManual" class="boton cancelar">
                CANCELAR
            </button>

        </div>


        <!-- ============================= -->
        <!-- ESCANEAR QR -->
        <!-- ============================= -->

        <div id="pantallaQR" class="pantalla oculto">

            <h2>Escanear código QR</h2>

            <p class="instruccion">
                Apunta la cámara hacia el código QR
            </p>

            <div id="reader"></div>

            <div id="qrExito" class="qr-exito oculto">
                ✓ QR ESCANEADO
            </div>

            <button id="btnCancelarQR" class="boton cancelar">
                CANCELAR
            </button>

        </div>


        <!-- ============================= -->
        <!-- FORMULARIO ENTRADA -->
        <!-- ============================= -->

        <div id="formularioEntrada" class="pantalla oculto">

            <h2>Registro de Entrada</h2>

            <div id="campoNombre">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre completo"
                    autocomplete="off"
                >

            </div>


            <p id="mensajeEntrada" class="mensaje"></p>

            <button id="btnNombre" class="boton registrar">
                CONTINUAR
            </button>

            <button id="btnCancelarEntrada" class="boton cancelar">
                CANCELAR
            </button>

        </div>


        <!-- ============================= -->
        <!-- ACTIVIDADES -->
        <!-- ============================= -->

        <div id="pantallaActividades" class="pantalla oculto">

            <h2>Selecciona la actividad</h2>

            <button class="boton actividad" data-actividad="Alfabetización">
                Alfabetización
            </button>

            <button class="boton actividad" data-actividad="Primaria INEA">
                Primaria INEA
            </button>

            <button class="boton actividad" data-actividad="Secundaria INEA">
                Secundaria INEA
            </button>

            <button id="btnPrepaAbierta" class="boton actividad">
                Prepa Abierta
            </button>

            <button id="btnPrepaLinea" class="boton actividad">
                Prepa en Línea
            </button>

            <button id="btnAsesoria" class="boton actividad">
                Asesorías
            </button>

            <button class="boton actividad" data-actividad="Computación">
                Computación
            </button>

            <button class="boton actividad" data-actividad="Uso de computadora">
                Uso de computadora
            </button>

            <button class="boton actividad" data-actividad="Servicio social">
                Servicio social
            </button>

            <button class="boton actividad" data-actividad="Beneficiarios">
                Beneficiarios
            </button>

            <button id="btnCancelarActividad" class="boton cancelar">
                CANCELAR
            </button>

        </div>


        <!-- ============================= -->
        <!-- SUBMENU -->
        <!-- ============================= -->

        <div id="pantallaSubmenu" class="pantalla oculto">

            <h2 id="tituloSubmenu"></h2>

            <div id="botonesSubmenu"></div>

            <button id="btnVolverActividades" class="boton cancelar">
                VOLVER
            </button>

        </div>


    </main>


    <script src="app.js"></script>

</body>

</html>
