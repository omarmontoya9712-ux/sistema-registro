<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro PILARES</title>

    <link rel="stylesheet" href="style.css">

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

</head>


<body>

<main class="contenedor">


    <!-- ===================================== -->
    <!-- ENCABEZADO -->
    <!-- ===================================== -->

    <header class="encabezado">

        <div class="icono-encabezado">
            🚎
        </div>

        <div class="titulo-principal">

            <h1>
                REGISTRO PILARES
            </h1>

            <p class="subtitulo">
                Registro de actividades
            </p>

        </div>

        <div class="icono-encabezado">
            🚎
        </div>

    </header>


    <!-- ===================================== -->
    <!-- INICIO -->
    <!-- ===================================== -->

    <section
        id="menuPrincipal"
        class="pantalla">

        <h2>
            Selecciona una opción
        </h2>


        <button
            id="btnEntrada"
            class="boton entrada"
            type="button">

            ENTRADA

        </button>


        <button
            id="btnSalida"
            class="boton salida"
            type="button">

            SALIDA

        </button>

    </section>


    <!-- ===================================== -->
    <!-- OPCIONES DE FOLIO -->
    <!-- ===================================== -->

    <section
        id="opcionesFolio"
        class="pantalla oculto">

        <h2 id="tituloFolio">
            Folio
        </h2>

        <p class="subtitulo">
            Selecciona cómo deseas ingresar el folio
        </p>


        <button
            id="btnManual"
            class="boton boton-manual"
            type="button">

            ✏️ INTRODUCIR FOLIO

        </button>


        <button
            id="btnQR"
            class="boton boton-qr"
            type="button">

            📷 ESCANEAR CÓDIGO QR

        </button>


        <button
            id="btnCancelarFolio"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- FOLIO MANUAL -->
    <!-- ===================================== -->

    <section
        id="pantallaManual"
        class="pantalla oculto">

        <h2>
            Introduce el folio
        </h2>


        <label for="folio">
            Folio
        </label>


        <input
            type="text"
            id="folio"
            placeholder="Escribe el folio"
            autocomplete="off"
        >


        <button
            id="btnContinuarFolio"
            class="boton registrar"
            type="button">

            CONTINUAR

        </button>


        <button
            id="btnCancelarManual"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- ESCANEAR QR -->
    <!-- ===================================== -->

    <section
        id="pantallaQR"
        class="pantalla oculto">

        <h2>
            📷 Escanear código QR
        </h2>


        <p class="instruccion">
            Apunta la cámara hacia el código QR
        </p>


        <div id="reader"></div>


        <!-- ================================= -->
        <!-- CAMBIAR CÁMARA -->
        <!-- ================================= -->

        <button
            id="btnCambiarCamara"
            class="boton"
            type="button">

            🔄 CAMBIAR CÁMARA

        </button>


        <!-- ================================= -->
        <!-- RESULTADO QR -->
        <!-- ================================= -->

        <div
            id="qrExito"
            class="qr-exito oculto">

            ✓ QR ESCANEADO

        </div>


        <p
            id="qrFolio"
            class="qr-folio">
        </p>


        <button
            id="btnCancelarQR"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- NUEVO USUARIO -->
    <!-- ===================================== -->

    <section
        id="formularioEntrada"
        class="pantalla oculto">

        <h2>
            👤 Nuevo registro
        </h2>


        <p
            id="mensajeEntrada"
            class="mensaje">
        </p>


        <div
            id="campoNombre">

            <label for="nombre">
                Nombre completo
            </label>


            <input
                type="text"
                id="nombre"
                placeholder="Nombre completo"
                autocomplete="off"
            >

        </div>


        <button
            id="btnNombre"
            class="boton registrar"
            type="button">

            CONTINUAR

        </button>


        <button
            id="btnCancelarEntrada"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- ACTIVIDADES -->
    <!-- ===================================== -->

    <section
        id="pantallaActividades"
        class="pantalla oculto">

        <h2>
            📚 Selecciona la actividad
        </h2>


        <div
            id="contenedorActividades"
            class="rejilla-actividades">


            <!-- ================================= -->
            <!-- ALFABETIZACIÓN -->
            <!-- ================================= -->

            <button
                class="boton actividad"
                data-actividad="Alfabetización"
                type="button">

                <span class="actividad-icono">
                    👓
                </span>

                <span class="actividad-texto">
                    Alfabetización
                </span>

            </button>


            <!-- ================================= -->
            <!-- PRIMARIA INEA -->
            <!-- ================================= -->

            <button
                class="boton actividad"
                data-actividad="Primaria INEA"
                type="button">

                <span class="actividad-icono">
                    📘
                </span>

                <span class="actividad-texto">
                    Primaria INEA
                </span>

            </button>


            <!-- ================================= -->
            <!-- SECUNDARIA INEA -->
            <!-- ================================= -->

            <button
                class="boton actividad"
                data-actividad="Secundaria INEA"
                type="button">

                <span class="actividad-icono">
                    📕
                </span>

                <span class="actividad-texto">
                    Secundaria INEA
                </span>

            </button>


            <!-- ================================= -->
            <!-- PREPA ABIERTA -->
            <!-- ================================= -->

            <button
                id="btnPrepaAbierta"
                class="boton actividad"
                type="button">

                <span class="actividad-icono">
                    🎓
                </span>

                <span class="actividad-texto">
                    Prepa Abierta
                </span>

            </button>


            <!-- ================================= -->
            <!-- PREPA EN LÍNEA -->
            <!-- ================================= -->

            <button
                id="btnPrepaLinea"
                class="boton actividad"
                type="button">

                <span class="actividad-icono">
                    🧑‍🎓
                </span>

                <span class="actividad-texto">
                    Prepa en Línea
                </span>

            </button>


            <!-- ================================= -->
            <!-- BACHILLERATOS PILARES -->
            <!-- ================================= -->

            <button
                id="btnBachilleratos"
                class="boton actividad"
                type="button">

                <span class="actividad-icono">
                    🏫
                </span>

                <span class="actividad-texto">
                    Bachilleratos PILARES
                </span>

            </button>


            <!-- ================================= -->
            <!-- ASESORÍAS ACADÉMICAS -->
            <!-- ================================= -->

            <button
                id="btnAsesoria"
                class="boton actividad"
                type="button">

                <span class="actividad-icono">
                    👨‍🏫
                </span>

                <span class="actividad-texto">
                    Asesorías académicas
                </span>

            </button>


            <!-- ================================= -->
            <!-- SABERES SECTEI -->
            <!-- ================================= -->

            <button
                id="btnSaberes"
                class="boton actividad"
                type="button">

                <span class="actividad-icono">
                    📚
                </span>

                <span class="actividad-texto">
                    Saberes SECTEI
                </span>

            </button>


            <!-- ================================= -->
            <!-- COMPUTACIÓN -->
            <!-- ================================= -->

            <button
                id="btnComputacion"
                class="boton actividad"
                type="button">

                <span class="actividad-icono">
                    💻
                </span>

                <span class="actividad-texto">
                    Computación
                </span>

            </button>


            <!-- ================================= -->
            <!-- USO DE COMPUTADORA -->
            <!-- ================================= -->

            <button
                class="boton actividad"
                data-actividad="Uso de computadora"
                type="button">

                <span class="actividad-icono">
                    🖱️
                </span>

                <span class="actividad-texto">
                    Uso de computadora
                </span>

            </button>


            <!-- ================================= -->
            <!-- SERVICIO SOCIAL -->
            <!-- ================================= -->

            <button
                class="boton actividad"
                data-actividad="Servicio social"
                type="button">

                <span class="actividad-icono">
                    🤝
                </span>

                <span class="actividad-texto">
                    Servicio social
                </span>

            </button>


            <!-- ================================= -->
            <!-- BENEFICIARIOS -->
            <!-- ================================= -->

            <button
                id="btnBeneficiarios"
                class="boton actividad"
                type="button">

                <span class="actividad-icono">
                    👥
                </span>

                <span class="actividad-texto">
                    Beneficiarios
                </span>

            </button>

        </div>


        <!-- ===================================== -->
        <!-- CANCELAR -->
        <!-- ===================================== -->

        <button
            id="btnCancelarActividad"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- SUBMENÚ -->
    <!-- ===================================== -->

    <section
        id="pantallaSubmenu"
        class="pantalla oculto">

        <h2 id="tituloSubmenu">
        </h2>


        <p
            id="instruccionSubmenu"
            class="instruccion-submenu oculto">
        </p>


        <div
            id="botonesSubmenu"
            class="rejilla-submenu">
        </div>


        <button
            id="btnVolverActividades"
            class="boton cancelar"
            type="button">

            ↩️ VOLVER

        </button>

    </section>


    <!-- ===================================== -->
    <!-- CONFIRMACIÓN FINAL -->
    <!-- ===================================== -->

    <section
        id="pantallaConfirmacion"
        class="pantalla confirmacion oculto">

        <div class="check-confirmacion">
            ✓
        </div>


        <h2 id="tituloConfirmacion">
            ¡Bienvenido!
        </h2>


        <p id="mensajeConfirmacion">
            ¡Vuelve pronto!
        </p>


        <p
            id="actividadConfirmacion"
            class="actividad-confirmacion">
        </p>

    </section>


</main>


<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->

<script src="app.js"></script>

</body>

</html>
