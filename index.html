<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Registro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <h1>Sistema de Registro</h1>

        <p class="subtitulo">
            Selecciona una opción
        </p>


        <!-- ============================== -->
        <!-- MENÚ PRINCIPAL -->
        <!-- ============================== -->

        <div
            id="menuPrincipal"
            class="botones-principales"
        >

            <button
                id="btnEntrada"
                class="boton entrada"
                type="button"
            >
                ENTRADA
            </button>


            <button
                id="btnSalida"
                class="boton salida"
                type="button"
            >
                SALIDA
            </button>

        </div>


        <!-- ============================== -->
        <!-- FORMULARIO -->
        <!-- ============================== -->

        <div
            id="formulario"
            class="formulario oculto"
        >

            <h2 id="tituloFormulario"></h2>


            <!-- FOLIO -->

            <label for="folio">
                Folio
            </label>

            <input
                type="text"
                id="folio"
                placeholder="Ingresa tu folio"
                autocomplete="off"
            >


            <!-- NOMBRE -->

            <div
                id="campoNombre"
                class="campo oculto"
            >

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre"
                    readonly
                >

            </div>


            <!-- ACTIVIDAD -->

            <div
                id="campoActividad"
                class="campo oculto"
            >

                <label for="actividad">
                    Actividad
                </label>

                <input
                    type="text"
                    id="actividad"
                    placeholder="Escribe la actividad"
                    autocomplete="off"
                >

            </div>


            <!-- MENSAJE -->

            <p
                id="mensaje"
                class="mensaje"
            ></p>


            <!-- REGISTRAR -->

            <button
                id="btnRegistrar"
                class="boton registrar"
                type="button"
            >
                REGISTRAR
            </button>


            <!-- CANCELAR -->

            <button
                id="btnCancelar"
                class="boton cancelar"
                type="button"
            >
                CANCELAR
            </button>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
