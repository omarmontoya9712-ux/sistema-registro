<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro PILARES</title>

    <!-- ESTILOS -->
    <link rel="stylesheet" href="style.css">

    <!-- LECTOR QR -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

</head>


<body>

<main class="contenedor">


    <!-- ===================================== -->
    <!-- ENCABEZADO -->
    <!-- ===================================== -->

    <header class="encabezado">

        <div class="icono-encabezado">
            🚎
        </div>

        <div class="titulo-principal">

            <h1>
                REGISTRO PILARES
            </h1>

            <p class="subtitulo">
                Registro de actividades
            </p>

        </div>

        <div class="icono-encabezado flor">
            🪻
        </div>

    </header>


    <!-- ===================================== -->
    <!-- INICIO -->
    <!-- ===================================== -->

    <section
        id="menuPrincipal"
        class="pantalla">

        <h2>
            Selecciona una opción
        </h2>


        <button
            id="btnEntrada"
            class="boton entrada"
            type="button">

            🟢 ENTRADA

        </button>


        <button
            id="btnSalida"
            class="boton salida"
            type="button">

            🔴 SALIDA

        </button>

    </section>


    <!-- ===================================== -->
    <!-- OPCIONES DE FOLIO -->
    <!-- ===================================== -->

    <section
        id="opcionesFolio"
        class="pantalla oculto">

        <h2 id="tituloFolio">
            Folio
        </h2>

        <p class="subtitulo">
            Selecciona cómo deseas ingresar el folio
        </p>


        <button
            id="btnManual"
            class="boton boton-manual"
            type="button">

            ✏️ INTRODUCIR FOLIO

        </button>


        <button
            id="btnQR"
            class="boton boton-qr"
            type="button">

            📷 ESCANEAR CÓDIGO QR

        </button>


        <button
            id="btnCancelarFolio"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- FOLIO MANUAL -->
    <!-- ===================================== -->

    <section
        id="pantallaManual"
        class="pantalla oculto">

        <h2>
            Introduce el folio
        </h2>


        <label for="folio">
            Folio
        </label>


        <input
            type="text"
            id="folio"
            placeholder="Escribe el folio"
            autocomplete="off"
        >


        <button
            id="btnContinuarFolio"
            class="boton registrar"
            type="button">

            CONTINUAR

        </button>


        <button
            id="btnCancelarManual"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- ESCANEAR QR -->
    <!-- ===================================== -->

    <section
        id="pantallaQR"
        class="pantalla oculto">

        <h2>
            📷 Escanear código QR
        </h2>


        <p class="instruccion">
            Apunta la cámara hacia el código QR
        </p>


        <div id="reader"></div>


        <div
            id="qrExito"
            class="qr-exito oculto">

            ✓ QR ESCANEADO

        </div>


        <p
            id="qrFolio"
            class="qr-folio">
        </p>


        <button
            id="btnCancelarQR"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- NUEVO USUARIO -->
    <!-- ===================================== -->

    <section
        id="formularioEntrada"
        class="pantalla oculto">

        <h2>
            👤 Nuevo registro
        </h2>


        <p
            id="mensajeEntrada"
            class="mensaje">
        </p>


        <div id="campoNombre">

            <label for="nombre">
                Nombre completo
            </label>


            <input
                type="text"
                id="nombre"
                placeholder="Nombre completo"
                autocomplete="off"
            >

        </div>


        <button
            id="btnNombre"
            class="boton registrar"
            type="button">

            CONTINUAR

        </button>


        <button
            id="btnCancelarEntrada"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- ACTIVIDADES -->
    <!-- ===================================== -->

    <section
        id="pantallaActividades"
        class="pantalla oculto">

        <h2>
            📚 Selecciona la actividad
        </h2>


        <!-- ALFABETIZACIÓN -->

        <button
            class="boton actividad"
            data-actividad="Alfabetización"
            type="button">

            <span class="actividad-icono">
                👓
            </span>

            <span>
                Alfabetización
            </span>

        </button>


        <!-- PRIMARIA -->

        <button
            class="boton actividad"
            data-actividad="Primaria INEA"
            type="button">

            <span class="actividad-icono">
                📘
            </span>

            <span>
                Primaria INEA
            </span>

        </button>


        <!-- SECUNDARIA -->

        <button
            class="boton actividad"
            data-actividad="Secundaria INEA"
            type="button">

            <span class="actividad-icono">
                📕
            </span>

            <span>
                Secundaria INEA
            </span>

        </button>


        <!-- PREPA ABIERTA -->

        <button
            id="btnPrepaAbierta"
            class="boton actividad"
            type="button">

            <span class="actividad-icono">
                🎓
            </span>

            <span>
                Prepa Abierta
            </span>

        </button>


        <!-- PREPA EN LÍNEA -->

        <button
            id="btnPrepaLinea"
            class="boton actividad"
            type="button">

            <span class="actividad-icono">
                🧑‍🎓
            </span>

            <span>
                Prepa en Línea
            </span>

        </button>


        <!-- ASESORÍAS -->

        <button
            id="btnAsesoria"
            class="boton actividad"
            type="button">

            <span class="actividad-icono">
                👨‍🏫
            </span>

            <span>
                Asesorías
            </span>

        </button>


        <!-- COMPUTACIÓN -->

        <button
            class="boton actividad"
            data-actividad="Computación"
            type="button">

            <span class="actividad-icono">
                🖥️
            </span>

            <span>
                Computación
            </span>

        </button>


        <!-- USO DE COMPUTADORA -->

        <button
            class="boton actividad"
            data-actividad="Uso de computadora"
            type="button">

            <span class="actividad-icono">
                🖱️
            </span>

            <span>
                Uso de computadora
            </span>

        </button>


        <!-- SERVICIO SOCIAL -->

        <button
            class="boton actividad"
            data-actividad="Servicio social"
            type="button">

            <span class="actividad-icono">
                🤝
            </span>

            <span>
                Servicio social
            </span>

        </button>


        <!-- BENEFICIARIOS -->

        <button
            class="boton actividad"
            data-actividad="Beneficiarios"
            type="button">

            <span class="actividad-icono">
                👥
            </span>

            <span>
                Beneficiarios
            </span>

        </button>


        <button
            id="btnCancelarActividad"
            class="boton cancelar"
            type="button">

            ↩️ CANCELAR

        </button>

    </section>


    <!-- ===================================== -->
    <!-- PANTALLA DE BIENVENIDA -->
    <!-- ===================================== -->

    <section
        id="pantallaBienvenida"
        class="pantalla oculto">

        <div class="bienvenida-icono">
            ✓
        </div>

        <h2 id="tituloBienvenida">
            ¡BIENVENIDO!
        </h2>

        <p
            id="mensajeBienvenida"
            class="mensaje-bienvenida">
        </p>

        <div
            id="actividadBienvenida"
            class="actividad-bienvenida">
        </div>

    </section>


    <!-- ===================================== -->
    <!-- SUBMENÚ -->
    <!-- ===================================== -->

    <section
        id="pantallaSubmenu"
        class="pantalla oculto">

        <h2 id="tituloSubmenu">
        </h2>


        <div id="botonesSubmenu">
        </div>


        <button
            id="btnVolverActividades"
            class="boton cancelar"
            type="button">

            ↩️ VOLVER

        </button>

    </section>


</main>


<!-- JAVASCRIPT -->

<script src="app.js"></script>

</body>

</html>
